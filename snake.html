<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Switch 2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body {
    background:#0a0f1e; min-height:100vh;
    display:flex; justify-content:center; align-items:center;
    font-family:system-ui,sans-serif; padding:10px;
  }
  .wrap {
    background:#1a1f2e; border-radius:20px; padding:16px;
    box-shadow:0 10px 30px #000;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  canvas {
    display:block;
    width:min(80vw,80vh); height:min(80vw,80vh);
    max-width:480px; max-height:480px;
    background:#0e121c; border-radius:14px;
    box-shadow:0 0 0 2px #3f4e6b;
    image-rendering:pixelated;
  }
  .hud {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; color:#b7d0ff; font-weight:700;
  }
  .score {
    background:#0b0f18; padding:8px 22px; border-radius:30px;
    font-size:1.3rem;
  }
  .status { font-size:1.1rem; color:#8fd3ff; }
  button {
    background:#2f3b55; color:#deecff; font-weight:bold;
    font-size:1rem; padding:10px 24px; border-radius:30px;
    border:none; cursor:pointer; box-shadow:0 4px 0 #0f1420;
    transition:0.05s;
  }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #0f1420; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv" width="400" height="400"></canvas>
  <div class="hud">
    <div class="score">🍎 <span id="score">0</span></div>
    <div class="status" id="status">GRAJ</div>
  </div>
  <button id="restart">↻ NOWA GRA</button>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const statusEl = document.getElementById('status');

  const N = 20;                 // 20x20 pól
  const CS = cv.width / N;      // rozmiar pola = 20px

  let snake, food, dir, nextDir, score, alive, interval;

  function reset(){
    clearInterval(interval);
    snake = [[10,10],[9,10],[8,10]];
    dir = 'RIGHT';
    nextDir = 'RIGHT';
    score = 0;
    alive = true;
    scoreEl.textContent = 0;
    statusEl.textContent = 'GRAJ';
    statusEl.style.color = '#8fd3ff';
    placeFood();
    draw();
    interval = setInterval(tick, 180);
  }

  function placeFood(){
    let fx, fy, tries = 0;
    do {
      fx = Math.floor(Math.random()*N);
      fy = Math.floor(Math.random()*N);
      tries++;
      if (tries > 500) break;
    } while (snake.some(s => s[0]===fx && s[1]===fy));
    food = [fx, fy];
  }

  function tick(){
    if (!alive) return;

    // blokada zawracania
    if ((dir==='RIGHT' && nextDir!=='LEFT') ||
        (dir==='LEFT'  && nextDir!=='RIGHT') ||
        (dir==='UP'    && nextDir!=='DOWN') ||
        (dir==='DOWN'  && nextDir!=='UP')) {
      dir = nextDir;
    }

    const head = snake[0];
    let nx = head[0], ny = head[1];
    if (dir==='RIGHT') nx++;
    else if (dir==='LEFT') nx--;
    else if (dir==='UP') ny--;
    else if (dir==='DOWN') ny++;

    // kolizja ze ścianą
    if (nx<0 || nx>=N || ny<0 || ny>=N) { gameOver(); return; }

    // kolizja z ciałem (bez ogona, bo ogon się przesunie)
    const hit = snake.slice(0, -1).some(s => s[0]===nx && s[1]===ny);
    if (hit) { gameOver(); return; }

    const ate = (nx===food[0] && ny===food[1]);
    snake.unshift([nx, ny]);
    if (ate) {
      score++;
      scoreEl.textContent = score;
      if (snake.length === N*N) { win(); return; }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver(){
    alive = false;
    clearInterval(interval);
    statusEl.textContent = 'PRZEGRANA';
    statusEl.style.color = '#ff8a8a';
    draw();
  }

  function win(){
    alive = false;
    clearInterval(interval);
    statusEl.textContent = 'WYGRANA!';
    statusEl.style.color = '#ffd966';
    draw();
  }

  function draw(){
    // tło
    ctx.fillStyle = '#0e121c';
    ctx.fillRect(0, 0, cv.width, cv.height);

    // siatka
    ctx.strokeStyle = '#1e2a3a';
    ctx.lineWidth = 0.5;
    for (let i=0; i<=N; i++){
      ctx.beginPath();
      ctx.moveTo(i*CS, 0); ctx.lineTo(i*CS, cv.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i*CS); ctx.lineTo(cv.width, i*CS);
      ctx.stroke();
    }

    // jedzenie
    ctx.fillStyle = '#ffaa33';
    ctx.beginPath();
    ctx.arc(food[0]*CS + CS/2, food[1]*CS + CS/2, CS*0.38, 0, Math.PI*2);
    ctx.fill();

    // wąż
    for (let i=0; i<snake.length; i++){
      const [x, y] = snake[i];
      ctx.fillStyle = (i===0) ? '#82e0aa' : `rgb(40, ${180 - i*2}, 70)`;
      ctx.fillRect(x*CS + 1, y*CS + 1, CS - 2, CS - 2);
    }

    // nakładka końca gry
    if (!alive){
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(statusEl.textContent, cv.width/2, cv.height/2);
    }
  }

  // --- STEROWANIE ---
  function setDir(d){
    if (!alive) return;
    nextDir = d;
  }

  // Klawiatura
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k==='ArrowUp' || k==='w' || k==='W')    { e.preventDefault(); setDir('UP'); }
    if (k==='ArrowDown' || k==='s' || k==='S')  { e.preventDefault(); setDir('DOWN'); }
    if (k==='ArrowLeft' || k==='a' || k==='A')  { e.preventDefault(); setDir('LEFT'); }
    if (k==='ArrowRight'|| k==='d' || k==='D')  { e.preventDefault(); setDir('RIGHT'); }
    if (k===' ' && !alive) reset();
  });

  // Gamepad (Switch 2 D-Pad)
  function pollGamepad(){
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads){
      if (!p) continue;
      // Standardowe mapowanie D-Pada: 12=góra, 13=dół, 14=lewo, 15=prawo
      if (p.buttons[12] && p.buttons[12].pressed) setDir('UP');
      if (p.buttons[13] && p.buttons[13].pressed) setDir('DOWN');
      if (p.buttons[14] && p.buttons[14].pressed) setDir('LEFT');
      if (p.buttons[15] && p.buttons[15].pressed) setDir('RIGHT');
      // A (0) = restart po przegranej
      if (p.buttons[0] && p.buttons[0].pressed && !alive) {
        if (!window._aPressed) { window._aPressed = true; reset(); }
      } else {
        window._aPressed = false;
      }
    }
    requestAnimationFrame(pollGamepad);
  }
  requestAnimationFrame(pollGamepad);

  document.getElementById('restart').addEventListener('click', reset);

  // start
  reset();
})();
</script>
</body>
</html>
