<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Spider-Man 3D - Miasto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #87ceeb;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Segoe UI', Arial, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }
        .hud-item {
            background: rgba(255,255,255,0.8);
            border: 2px solid #e74c3c;
            padding: 10px 20px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            border-radius: 25px;
            letter-spacing: 1px;
        }
        #score-display { color: #e74c3c; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0,0,0,0.8);
            border-radius: 2px;
        }
        #crosshair::before { width: 2px; height: 30px; left: 14px; top: 0; }
        #crosshair::after { width: 30px; height: 2px; left: 0; top: 14px; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
        }
        .dpad {
            display: grid;
            grid-template-columns: 55px 55px 55px;
            grid-template-rows: 55px 55px 55px;
            gap: 4px;
            pointer-events: auto;
        }
        .btn {
            width: 55px;
            height: 55px;
            background: rgba(255,255,255,0.7);
            border: 2px solid rgba(0,0,0,0.3);
            color: #333;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            touch-action: none;
        }
        .btn:active { background: rgba(231,76,60,0.7); border-color: #e74c3c; }
        .action-buttons { display: flex; gap: 10px; pointer-events: auto; }
        .action-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #webBtn { background: rgba(100,100,100,0.7); border-color: #555; }
        #jumpBtn { background: rgba(46,204,113,0.8); border-color: #2ecc71; }
        #freezeBtn { background: rgba(52,152,219,0.8); border-color: #3498db; }
        #freezeBtn.active { background: rgba(231,76,60,0.9); border-color: #e74c3c; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud">
        <div class="hud-item">🕷️ SPIDER-MAN</div>
        <div class="hud-item">PUNKTY: <span id="score-display">0</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="controls">
        <div class="dpad">
            <div></div>
            <button class="btn" id="btnUp">▲</button>
            <div></div>
            <button class="btn" id="btnLeft">◀</button>
            <button class="btn" id="btnDown">▼</button>
            <button class="btn" id="btnRight">▶</button>
        </div>
        <div class="action-buttons">
            <button class="action-btn" id="freezeBtn">❄️</button>
            <button class="action-btn" id="webBtn">🕸️</button>
            <button class="action-btn" id="jumpBtn">⬆️</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const pixelRatio = Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2);
        
        const canvas = document.getElementById('game');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 50, 120);
        
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.7, 0);
        
        const renderer = new THREE.WebGLRenderer({ 
            canvas, 
            antialias: !isMobile,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(pixelRatio);
        renderer.shadowMap.enabled = !isMobile;
        
        scene.add(new THREE.AmbientLight(0x8899aa, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(30, 50, 20);
        if (!isMobile) {
            sun.castShadow = true;
            sun.shadow.mapSize.width = 1024;
            sun.shadow.mapSize.height = 1024;
            sun.shadow.camera.left = -50;
            sun.shadow.camera.right = 50;
            sun.shadow.camera.top = 50;
            sun.shadow.camera.bottom = -50;
        }
        scene.add(sun);
        
        // ============ ULICA ============
        const roadGeo = new THREE.PlaneGeometry(150, 150);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.7 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);
        
        // Linie na ulicy
        function createRoadLine(x, z, width, length, isHorizontal) {
            const lineGeo = new THREE.PlaneGeometry(isHorizontal ? length : width, isHorizontal ? width : length);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(x, 0.01, z);
            scene.add(line);
        }
        
        // Linie przerywane na środku
        for (let i = -75; i < 75; i += 10) {
            if (i % 20 === 0) continue;
            createRoadLine(i, 0, 0.3, 3, true);
        }
        
        for (let j = -75; j < 75; j += 10) {
            if (j % 20 === 0) continue;
            createRoadLine(0, j, 0.3, 3, false);
        }
        
        // Pas na przejściu dla pieszych
        function createCrosswalk(x, z) {
            for (let i = -2; i <= 2; i++) {
                const stripeGeo = new THREE.PlaneGeometry(0.8, 3);
                const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(x + i * 1.5, 0.02, z);
                scene.add(stripe);
            }
        }
        
        // Skrzyżowania
        for (let i = -3; i <= 3; i++) {
            for (let j = -3; j <= 3; j++) {
                if (i === 0 && j === 0) continue;
                createCrosswalk(i * 28, j * 28);
            }
        }
        
        // ============ BUDYNKI ============
        const buildings = [];
        const buildingColors = [0xd4a574, 0xc4956a, 0xb8865a, 0xe0b080, 0xcc9966, 0xddbb88];
        
        function createBuilding(x, z) {
            const w = 5 + Math.random() * 5;
            const h = 15 + Math.random() * 30;
            const d = 5 + Math.random() * 5;
            const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
            
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h/2, z);
            if (!isMobile) {
                mesh.castShadow = true;
                mesh.receiveShadow = true;
            }
            scene.add(mesh);
            
            // Okna
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x6699cc, roughness: 0.2, metalness: 0.8 });
            for (let wy = h * 0.25; wy < h * 0.75; wy += 4) {
                for (let wx = -w/2 + 1.5; wx < w/2 - 1; wx += 2.5) {
                    const windowGeo = new THREE.PlaneGeometry(0.8, 1.2);
                    const windowMesh = new THREE.Mesh(windowGeo, windowMat);
                    windowMesh.position.set(x + wx, wy, z + d/2 + 0.01);
                    scene.add(windowMesh);
                }
            }
            
            buildings.push({ x, z, w, h, d, mesh });
        }
        
        for (let i = -4; i <= 4; i++) {
            for (let j = -4; j <= 4; j++) {
                if (i === 0 && j === 0) continue;
                createBuilding(i * 14, j * 14);
            }
        }
        
        // ============ PAJĘCZYNA ============
        const web = {
            active: false,
            anchor: null,
            length: 0,
            line: null,
            pullStrength: 1.2,
            damping: 0.92
        };
        
        function shootWeb() {
            if (web.active) {
                web.active = false;
                web.anchor = null;
                if (web.line) scene.remove(web.line);
                web.line = null;
                return;
            }
            
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            
            const raycaster = new THREE.Raycaster(camera.position, direction);
            const meshes = buildings.map(b => b.mesh);
            const hits = raycaster.intersectObjects(meshes);
            
            if (hits.length > 0) {
                web.anchor = hits[0].point;
                web.active = true;
                web.length = camera.position.distanceTo(web.anchor);
                
                const geo = new THREE.BufferGeometry().setFromPoints([camera.position, web.anchor]);
                const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
                web.line = new THREE.Line(geo, mat);
                scene.add(web.line);
                
                const pullDir = web.anchor.clone().sub(camera.position).normalize();
                state.velocity.add(pullDir.multiplyScalar(0.5));
            }
        }
        
        function updateWeb() {
            if (!web.active || !web.anchor) return;
            
            const toAnchor = web.anchor.clone().sub(camera.position);
            const dist = toAnchor.length();
            const dir = toAnchor.normalize();
            
            state.velocity.x += dir.x * web.pullStrength * 0.08;
            state.velocity.y += dir.y * web.pullStrength * 0.08;
            state.velocity.z += dir.z * web.pullStrength * 0.08;
            
            if (dist > web.length) {
                const clampedPos = web.anchor.clone().sub(dir.multiplyScalar(web.length));
                camera.position.copy(clampedPos);
            }
            
            state.velocity.multiplyScalar(web.damping);
            
            if (web.line) {
                scene.remove(web.line);
                web.line.geometry.dispose();
                web.line.geometry = new THREE.BufferGeometry().setFromPoints([camera.position, web.anchor]);
                scene.add(web.line);
            }
        }
        
        // ============ STAN ============
        const state = {
            yaw: 0,
            pitch: 0,
            velocity: new THREE.Vector3(),
            grounded: true,
            frozen: false,
            score: 0
        };
        
        const keys = {};
        
        // ============ KOLIZJE ============
        function checkCollision(pos) {
            const r = 0.4;
            for (const b of buildings) {
                if (Math.abs(pos.x - b.x) < b.w/2 + r &&
                    Math.abs(pos.z - b.z) < b.d/2 + r &&
                    pos.y < b.h) {
                    const dx = pos.x - b.x;
                    const dz = pos.z - b.z;
                    if (Math.abs(dx) > Math.abs(dz)) {
                        pos.x = b.x + Math.sign(dx) * (b.w/2 + r);
                    } else {
                        pos.z = b.z + Math.sign(dz) * (b.d/2 + r);
                    }
                }
            }
            return pos;
        }
        
        // ============ STEROWANIE ============
        function bind(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                e.stopPropagation();
                keys[key] = true;
            });
            btn.addEventListener('touchend', e => {
                e.preventDefault();
                e.stopPropagation();
                keys[key] = false;
            });
        }
        
        bind('btnUp', 'up');
        bind('btnDown', 'down');
        bind('btnLeft', 'left');
        bind('btnRight', 'right');
        bind('jumpBtn', 'jump');
        
        document.getElementById('webBtn').addEventListener('touchstart', e => {
            e.preventDefault();
            e.stopPropagation();
            shootWeb();
        });
        
        document.getElementById('freezeBtn').addEventListener('touchstart', e => {
            e.preventDefault();
            e.stopPropagation();
            state.frozen = !state.frozen;
            document.getElementById('freezeBtn').classList.toggle('active', state.frozen);
            if (state.frozen) state.velocity.set(0, 0, 0);
        });
        
        let dragging = false;
        let lastX = 0, lastY = 0;
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (e.touches.length === 1) {
                dragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            }
        });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (dragging && e.touches.length === 1) {
                const dx = e.touches[0].clientX - lastX;
                const dy = e.touches[0].clientY - lastY;
                state.yaw -= dx * 0.004;
                state.pitch -= dy * 0.004;
                state.pitch = Math.max(-1.0, Math.min(1.0, state.pitch));
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            }
        });
        
        canvas.addEventListener('touchend', () => { dragging = false; });
        
        // ============ PĘTLA ============
        const clock = new THREE.Clock();
        
        function update() {
            const delta = Math.min(clock.getDelta(), 0.05);
            
            if (!state.frozen) {
                const forward = new THREE.Vector3(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
                const right = new THREE.Vector3(Math.cos(state.yaw), 0, -Math.sin(state.yaw));
                const move = new THREE.Vector3();
                
                if (keys.up) move.add(forward);
                if (keys.down) move.sub(forward);
                if (keys.right) move.add(right);
                if (keys.left) move.sub(right);
                
                if (move.length() > 0) {
                    move.normalize().multiplyScalar(0.06);
                    state.velocity.x = move.x;
                    state.velocity.z = move.z;
                } else {
                    state.velocity.x *= 0.8;
                    state.velocity.z *= 0.8;
                }
                
                if (keys.jump && state.grounded) {
                    state.velocity.y = 2.5;
                    state.grounded = false;
                    keys.jump = false;
                }
                
                updateWeb();
                
                state.velocity.y += web.active ? -0.04 : -0.2;
                
                const newPos = camera.position.clone().add(state.velocity);
                camera.position.copy(checkCollision(newPos));
                
                if (camera.position.y <= 1.7) {
                    camera.position.y = 1.7;
                    state.velocity.y = 0;
                    state.grounded = true;
                    if (web.active) {
                        web.active = false;
                        web.anchor = null;
                        if (web.line) scene.remove(web.line);
                        web.line = null;
                    }
                }
                
                const speed = Math.sqrt(state.velocity.x**2 + state.velocity.z**2);
                if (speed > 0.05) {
                    state.score += Math.floor(speed * 100);
                    document.getElementById('score-display').textContent = state.score;
                }
            }
            
            camera.rotation.order = 'YXZ';
            camera.rotation.y = state.yaw;
            camera.rotation.x = state.pitch;
        }
        
        function loop() {
            requestAnimationFrame(loop);
            update();
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        loop();
    </script>
</body>
</html>
