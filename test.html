<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { background:#000; color:#0f0; font-family:monospace; font-size:24px; padding:20px; margin:0; }
  canvas { display:block; width:100vw; height:100vh; image-rendering:pixelated; position:fixed; top:0; left:0; }
  #info { position:fixed; top:10px; left:10px; z-index:10; background:rgba(0,0,0,0.8); padding:10px; }
  #fps { color:#e60012; font-size:60px; font-weight:bold; }
</style>
</head>
<body>
<div id="info">
  <div>FPS: <span id="fps">0</span></div>
  <div style="font-size:14px;color:#888">Kliknij: 1=80x50  2=160x100  3=320x200  4=640x400</div>
  <div style="font-size:14px;color:#0f0" id="res">320x200</div>
</div>
<canvas id="c"></canvas>

<script>
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d", { alpha: false });
var fpsEl = document.getElementById("fps");
var resEl = document.getElementById("res");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

var buf = document.createElement("canvas");
var bctx = buf.getContext("2d", { alpha: false });
var imgData;
var RW = 320, RH = 200;

function setup(w, h) {
  RW = w; RH = h;
  buf.width = w; buf.height = h;
  imgData = bctx.createImageData(w, h);
  resEl.textContent = w + "x" + h;
}
setup(320, 200);

window.addEventListener("keydown", function(e) {
  if (e.key === "1") setup(80, 50);
  if (e.key === "2") setup(160, 100);
  if (e.key === "3") setup(320, 200);
  if (e.key === "4") setup(640, 400);
});

var frames = 0, last = Date.now();
var pixels = imgData.data;
var t = 0;

function loop() {
  t++;

  // Wypełnij bufor kolorami (symuluje renderowanie)
  var len = pixels.length;
  for (var i = 0; i < len; i += 4) {
    pixels[i] = (i + t) & 255;
    pixels[i+1] = ((i >> 8) + t) & 255;
    pixels[i+2] = 100;
    pixels[i+3] = 255;
  }
  bctx.putImageData(imgData, 0, 0);

  // Skaluj
  var cw = canvas.width, ch = canvas.height;
  var targetRatio = RW / RH;
  var screenRatio = cw / ch;
  var dw, dh, dx, dy;
  if (screenRatio > targetRatio) {
    dh = ch; dw = ch * targetRatio;
    dx = (cw - dw) / 2; dy = 0;
  } else {
    dw = cw; dh = cw / targetRatio;
    dx = 0; dy = (ch - dh) / 2;
  }

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, RW, RH, dx, dy, dw, dh);

  frames++;
  var now = Date.now();
  if (now - last > 1000) {
    fpsEl.textContent = frames;
    frames = 0;
    last = now;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
